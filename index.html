<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>W6: Catch the Killer</title>
    <link rel="shortcut icon" href="TemplateData/w6icon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  
    <!-- W6 mobile touch patch -->
    <meta name="viewport" content="width=device-width,height=device-height,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes,viewport-fit=cover">
    <style>
      html, body, #unity-container { margin:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; }
      #unity-canvas { touch-action:none; -ms-touch-action:none; -webkit-user-select:none; user-select:none; transform-origin:0 0; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="1600" height="900" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      window.addEventListener("load", function () {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.register("ServiceWorker.js");
        }
      });

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/iOS (WebApp).loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/iOS (WebApp).data",
        frameworkUrl: buildUrl + "/iOS (WebApp).framework.js",
        codeUrl: buildUrl + "/iOS (WebApp).wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Stelex Software",
        productName: "W6 - Catch the Killer",
        productVersion: "0.2026-08-22a",
        // W6 Mobile HD.
        devicePixelRatio: 2,
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  
    <script>
      // W6 manual pinch zoom for mobile Safari / touch browsers.
      // One finger is left completely to Unity for card dragging.
      // Two fingers zoom and pan the Unity canvas without relying on Safari's page zoom.
      (function () {
        var canvas = document.getElementById('unity-canvas');
        if (!canvas) return;

        var scale = 1;
        var translateX = 0;
        var translateY = 0;

        var pinchActive = false;
        var startDistance = 0;
        var startScale = 1;
        var anchorX = 0;
        var anchorY = 0;

        var MIN_SCALE = 1;
        var MAX_SCALE = 4;

        function distance(t1, t2) {
          var dx = t2.clientX - t1.clientX;
          var dy = t2.clientY - t1.clientY;
          return Math.sqrt(dx * dx + dy * dy);
        }

        function midpoint(t1, t2) {
          return {
            x: (t1.clientX + t2.clientX) / 2,
            y: (t1.clientY + t2.clientY) / 2
          };
        }

        function clamp(value, min, max) {
          return Math.max(min, Math.min(max, value));
        }

        function clampTranslation() {
          var vw = window.innerWidth;
          var vh = window.innerHeight;
          var minX = vw * (1 - scale);
          var minY = vh * (1 - scale);

          translateX = clamp(translateX, minX, 0);
          translateY = clamp(translateY, minY, 0);
        }

        function applyTransform() {
          clampTranslation();
          canvas.style.transform =
            'translate3d(' + translateX + 'px,' + translateY + 'px,0) scale(' + scale + ')';
        }

        document.addEventListener('touchstart', function (e) {
          if (e.touches.length === 2 &&
              (e.target === canvas || pinchActive)) {
            var mid = midpoint(e.touches[0], e.touches[1]);

            pinchActive = true;
            startDistance = distance(e.touches[0], e.touches[1]);
            startScale = scale;

            anchorX = (mid.x - translateX) / scale;
            anchorY = (mid.y - translateY) / scale;

            e.preventDefault();
          }
        }, { passive: false, capture: true });

        document.addEventListener('touchmove', function (e) {
          if (!pinchActive || e.touches.length < 2) return;

          var mid = midpoint(e.touches[0], e.touches[1]);
          var newDistance = distance(e.touches[0], e.touches[1]);

          if (startDistance > 0) {
            scale = clamp(startScale * (newDistance / startDistance), MIN_SCALE, MAX_SCALE);
            translateX = mid.x - anchorX * scale;
            translateY = mid.y - anchorY * scale;
            applyTransform();
          }

          e.preventDefault();
          e.stopPropagation();
        }, { passive: false, capture: true });

        document.addEventListener('touchend', function (e) {
          if (pinchActive && e.touches.length < 2) {
            pinchActive = false;

            if (scale <= 1.001) {
              scale = 1;
              translateX = 0;
              translateY = 0;
              applyTransform();
            }
          }
        }, { passive: false, capture: true });

        document.addEventListener('touchcancel', function (e) {
          if (e.touches.length < 2) {
            pinchActive = false;
          }
        }, { passive: false, capture: true });

        window.addEventListener('resize', applyTransform);
        window.addEventListener('orientationchange', function () {
          setTimeout(applyTransform, 100);
        });
      })();
    </script>
  </body>
</html>
